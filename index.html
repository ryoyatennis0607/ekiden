<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三大駅伝 出走記録</title>
<style>
:root{color-scheme:light;--ink:#202735;--muted:#667085;--line:#e3e7ed;--paper:#fff;--bg:#f5f7fa;--accent:#245b8f;--soft:#eef4fa;--agu:#18775f;--kokugakuin:#762b37;--waseda:#a1233b;--komazawa:#624583;--chuo:#bd303b;--juntendo:#3478a8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",Meiryo,sans-serif;font-size:15px;line-height:1.55}
header{background:var(--paper);border-bottom:1px solid var(--line)}
.wrap{max-width:1280px;margin:0 auto;padding:24px 22px}
header .wrap{padding-top:26px;padding-bottom:22px}
h1{margin:0;font-size:1.55rem;font-weight:650;letter-spacing:.01em}
.intro{margin:7px 0 0;color:var(--muted)}
main{max-width:1280px;margin:0 auto;padding:20px 22px 38px}
.filters{display:flex;align-items:end;gap:12px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:15px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.82rem;color:var(--muted)}
.status-switch{display:flex;gap:3px;padding:3px;border:1px solid #cfd6df;border-radius:6px;background:#f8fafc}
.status-switch button{min-height:32px;padding:4px 12px;border:0;border-radius:4px;background:transparent;color:#475467;font:inherit;font-size:.88rem;cursor:pointer}
.status-switch button[aria-pressed="true"]{background:#fff;color:#173f68;box-shadow:0 1px 3px #15283d24;font-weight:650}
select,input{height:40px;padding:8px 10px;border:1px solid #cfd6df;border-radius:5px;background:#fff;color:var(--ink);font:inherit}
select{min-width:190px}
input{width:min(260px,75vw)}
select:focus,input:focus,button:focus-visible,a:focus-visible{outline:3px solid #a9c9e7;outline-offset:2px}
.count{margin-left:auto;color:var(--muted);font-size:.9rem;padding:8px 0}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;background:#f8fafc;color:#4a5565;font-size:.82rem;font-weight:600;white-space:nowrap;border-bottom:1px solid var(--line);padding:11px 14px}
tbody td{vertical-align:top;border-bottom:1px solid var(--line);padding:9px 14px}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fbfcfe}
.school{width:102px;min-width:102px;white-space:normal;font-size:.84rem}
.school,.runner{vertical-align:middle}
.school-label{display:inline-block}
.school-label.team-mark{display:inline-block;max-width:100%;margin-left:5px;padding:2px 0 2px 5px;border-radius:4px;background:color-mix(in srgb,var(--team) 12%,#fff)}
.runner{width:180px;min-width:180px;font-weight:600;white-space:nowrap}
.runner.long-name{font-size:.88rem}
.runner-name{display:inline}
.runner-status{display:inline;margin-left:3px;font-size:.8rem;font-weight:500;color:#667085;white-space:nowrap}
.runner-status.current{color:#356254}
.records-table{min-width:850px}
.records-table th.event-izumo{background:#e8efff;color:#315c9a}
.records-table th.event-alljapan{background:#fff0dc;color:#865323}
.records-table th.event-hakone{background:#eaf3eb;color:#39704b}
.history-cell{min-width:188px;vertical-align:top}
.history-cell.event-izumo{background:#f5f8ff}
.history-cell.event-alljapan{background:#fff9f1}
.history-cell.event-hakone{background:#f5faf5}
.history-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.record{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;width:100%;min-width:0;border:1px solid #d5dde7;border-radius:5px;background:#fff;color:#344054;padding:5px 7px;font:inherit;line-height:1.3;cursor:pointer;text-align:left}
.record:hover{border-color:#8aa9c8;background:#fff;color:#153d66}
.record-year{font-size:.7rem;font-weight:600;color:#697586;font-variant-numeric:tabular-nums;white-space:nowrap}
.record-detail{display:flex;align-items:center;gap:5px;font-size:.83rem;font-weight:650;white-space:nowrap}
.record .rank{padding:0;color:#344054;font-weight:700}
.record.medal-1{background:#fff6d9;border-color:#d9b64e}
.record.medal-2{background:#e8ecf0;border-color:#c2cbd4}
.record.medal-3{background:#fff0e4;border-color:#ce9468}
.record.medal-1 .rank,.leaderboard tr.podium-1 td:first-child{background:#f0d47a;color:#604907;font-weight:700}
.record.medal-2 .rank,.leaderboard tr.podium-2 td:first-child{background:#cfd7df;color:#3f4a55;font-weight:700}
.record.medal-3 .rank,.leaderboard tr.podium-3 td:first-child{background:#e8bd9d;color:#714326;font-weight:700}
.no-record{color:#c0c5ce;text-align:center}
.empty{color:var(--muted);padding:28px;text-align:center}
footer{max-width:1280px;margin:14px auto 0;padding:0 22px 28px;color:var(--muted);font-size:.83rem}
.source-links{display:flex;gap:12px;flex-wrap:wrap;margin-top:7px}
a{color:var(--accent)}
dialog{width:min(760px,calc(100vw - 28px));max-height:min(86vh,820px);padding:0;border:1px solid #cfd6df;border-radius:10px;box-shadow:0 18px 55px rgba(18,35,55,.24);color:var(--ink)}
dialog::backdrop{background:rgba(20,30,43,.45)}
.dialog-head{position:sticky;top:0;z-index:1;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:17px 19px;background:#fff;border-bottom:1px solid var(--line)}
.dialog-head h2{margin:0;font-size:1.15rem;font-weight:650}
.close{border:1px solid var(--line);border-radius:5px;background:#fff;padding:5px 10px;color:var(--ink);font:inherit;cursor:pointer}
.dialog-body{padding:12px 18px 17px;overflow:auto}
.context{margin:0 0 12px;color:var(--muted);font-size:.9rem}
.leaderboard th,.leaderboard td{padding:9px 10px}
.leaderboard td:first-child,.leaderboard th:first-child{width:64px;text-align:right;font-variant-numeric:tabular-nums}
.leaderboard td:last-child,.leaderboard th:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.leaderboard tr.podium-1{background:#fff7df}
.leaderboard tr.podium-2{background:#f3f5f7}
.leaderboard tr.podium-3{background:#fff2e8}
.leaderboard tr.podium-1 td:first-child,.leaderboard tr.podium-2 td:first-child,.leaderboard tr.podium-3 td:first-child{border-radius:4px}
.leaderboard tr.current{background:#eef5fb;font-weight:600}
.leaderboard tr.current.podium-1{background:#fff4d9}
.legend{margin:8px 0 0;color:var(--muted);font-size:.8rem}
.dialog-source{margin:12px 0 0;text-align:right;font-size:.82rem}
@media(max-width:700px){
 .wrap,main{padding-left:14px;padding-right:14px}
 .filters{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:end;gap:9px;padding:12px}
 .field{min-width:0}
 .field:nth-child(1){grid-column:1}
 .field:nth-child(2){grid-column:2}
 .field:nth-child(3){grid-column:1}
 select,input{width:100%;min-width:0;min-height:40px;padding:7px 8px;font-size:.9rem}
 .status-switch{min-height:40px;align-items:center}
 .status-switch button{min-height:32px;padding:4px 10px}
 .count{grid-column:2;margin:0;width:auto;padding:0 2px 9px;text-align:right;font-size:.82rem;white-space:nowrap}
 h1{font-size:1.3rem}
 .table-scroll{overflow-x:hidden}
 .records-table{display:block;width:100%;min-width:0}
 .records-table thead{display:none}
 .records-table tbody{display:block;width:100%}
 .records-table tbody tr{display:grid;grid-template-columns:minmax(0,36%) minmax(0,1fr);grid-template-areas:"school runner" "izumo izumo" "alljapan alljapan" "hakone hakone";border-bottom:1px solid var(--line)}
 .records-table tbody tr:last-child{border-bottom:0}
 .records-table tbody td{display:block;min-width:0;width:auto;padding:7px 9px;border:0}
 .records-table tbody td.school{grid-area:school;width:auto;min-width:0;align-self:stretch;font-size:.78rem}
 .records-table tbody td.runner{grid-area:runner;width:auto;min-width:0;white-space:normal;font-size:.9rem}
 .records-table tbody td.runner.long-name{font-size:.78rem}
 .records-table tbody td.history-cell{display:grid;grid-template-columns:50px minmax(0,1fr);align-items:start;gap:6px;min-width:0;padding:6px 9px}
 .records-table tbody td.event-izumo{grid-area:izumo}
 .records-table tbody td.event-alljapan{grid-area:alljapan}
 .records-table tbody td.event-hakone{grid-area:hakone}
 .history-cell.event-izumo::before{content:"出雲";color:#315c9a}
 .history-cell.event-alljapan::before{content:"全日本";color:#865323}
 .history-cell.event-hakone::before{content:"箱根";color:#39704b}
 .history-cell::before{font-size:.75rem;font-weight:700;line-height:1.6}
 .history-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
 .record{padding:4px 6px}
 .record-detail{gap:4px;font-size:.78rem}
 .records-table tbody td.empty{grid-column:1/-1;padding:24px 12px}
}
</style>
</head>

nt":"全日本","year":2023,"leg":8,"rank":6,"time":"1:00:07","name":"浅井 皓貴","school":"順天堂大学","grade":"3年"},{"event":"全日本","year":2023,"leg":8,"rank":7,"time":"1:00:22","name":"吉田 凌","school":"創価大学","grade":"3年"},{"event":"全日本","year":2023,"leg":8,"rank":8,"time":"1:00:25","name":"守屋 和希","school":"関西学院大学","grade":"4年"},{"event":"全日本","year":2023,"leg":8,"rank":9,"time":"1:01:54","name":"菊地 駿介","school":"大東文化大学","grade":"4年"},{"event":"全日本","year":2023,"leg":8,"rank":10,"time":"1:02:10","name":"川内 琉生","school":"東京国際大学","grade":"2年"}]},"sources":[{"label":"箱根駅伝公式記録","url":"https://www.hakone-ekiden.jp/record/"},{"label":"出雲駅伝大会結果","url":"https://www.izumo-ekiden.jp/"},{"label":"全日本大学駅伝公式記録","url":"https://www.iuau.jp/"}],"coverage":{"hakone":"2022〜2026年","izumo":"2023〜2025年","alljapan":"2023〜2025年"}}</script>
<script>
(function(){
"use strict";
const data=JSON.parse(document.getElementById("dataset").textContent);
const schoolOrder=data.schools;
const names={hakone:"箱根",izumo:"出雲",alljapan:"全日本"};
const schoolDisplayNames={"青山学院大学":"青山学院"};
const schoolColors={"青山学院大学":"var(--agu)","國學院大學":"var(--kokugakuin)","早稲田大学":"var(--waseda)","駒澤大学":"var(--komazawa)","中央大学":"var(--chuo)","順天堂大学":"var(--juntendo)"};
const activeRoster=[
 ["順天堂大学","吉岡 大翔",4],["順天堂大学","小林 侑世",4],["順天堂大学","林 龍正",4],["順天堂大学","荒牧 琢登",4],["順天堂大学","古川 達也",4],
 ["順天堂大学","池間 凛斗",3],["順天堂大学","川原 琉人",3],["順天堂大学","谷本 昂士郎",3],["順天堂大学","玉目 陸",3],["順天堂大学","永原 颯磨",3],["順天堂大学","山本 悠",3],
 ["順天堂大学","井上 朋哉",2],
 ["青山学院大学","佐藤 愛斗",3],["青山学院大学","小河原 陽琉",3],["青山学院大学","神邑 亮佑",2],["青山学院大学","石川 浩輝",2],["青山学院大学","折田 壮太",3],["青山学院大学","鳥井 健太",4],["青山学院大学","飯田 翔大",3],["青山学院大学","平松 享祐",4],
 ["國學院大學","吉田 蔵之介",4],["國學院大學","後村 光星",4],["國學院大學","髙石 樹",2],["國學院大學","浅野 結太",3],["國學院大學","辻原 輝",4],["國學院大學","田中 愛睦",4],["國學院大學","飯國 新太",3],["國學院大學","尾熊 迅斗",3],["國學院大學","野中 恒亨",4],["國學院大學","野田 顕臣",2],
 ["早稲田大学","吉倉 ナヤブ直希",3],["早稲田大学","工藤 慎作",4],["早稲田大学","佐々木 哲",2],["早稲田大学","山口 竣平",3],["早稲田大学","山﨑 一吹",4],["早稲田大学","小平 敦之",4],["早稲田大学","瀬間 元輔",3],["早稲田大学","堀野 正太",2],["早稲田大学","鈴木 琉胤",2],
 ["駒澤大学","安原 海晴",4],["駒澤大学","小山 翔也",4],["駒澤大学","村上 響",4],["駒澤大学","島子 公佑",4],["駒澤大学","桑田 駿介",3],["駒澤大学","菅谷 希弥",3],["駒澤大学","谷中 晴",3],
 ["中央大学","山﨑 草太",4],["中央大学","柴田 大地",4],["中央大学","藤田 大智",4],["中央大学","本間 颯",4],["中央大学","岡田 開成",3],["中央大学","佐藤 大介",3],["中央大学","七枝 直",3],["中央大学","並川 颯太",3],["中央大学","三宅 悠斗",2],["中央大学","濵口 大和",2]
];
function normalizeName(value){return value.replace(/[\s\u3000]/g,"").replace(/[髙高]/g,"高").replace(/[國国]/g,"国").replace(/[﨑神]/g,function(c){return c==="神"?"神":"崎"}).replace(/[濵浜]/g,"浜")}
const activeByKey=new Map(activeRoster.map(function(row){return[row[0]+"|"+normalizeName(row[1]),{grade:row[2]}]}));
function activeStudent(school,name){return activeByKey.get(school+"|"+normalizeName(name))||null}
function gradeAt(record,slug,year){
 if(record.grade)return record.grade;
 const current=activeStudent(record.school,record.name);if(!current)return "—";
 const eventAcademicYear=slug==="hakone"?year-1:year;
 const grade=current.grade-(2026-eventAcademicYear);
 return grade>=1&&grade<=4?grade+"年":"—";
}
const groups=new Map();
data.appearances.forEach(function(r){
 const key=r.school+"|"+r.name;
 if(!groups.has(key))groups.set(key,{school:r.school,name:r.name,records:[]});
 groups.get(key).records.push(r);
});
const select=document.getElementById("school-filter");
data.schools.forEach(function(s){
 const o=document.createElement("option");o.value=s;o.textContent=schoolDisplayNames[s]||s;select.appendChild(o);
});
const tbody=document.getElementById("records");
const query=document.getElementById("name-filter");
const count=document.getElementById("count");
const dialog=document.getElementById("detail-dialog");
const dialogTitle=document.getElementById("dialog-title");
const dialogContext=document.getElementById("dialog-context");
const leaderboard=document.getElementById("leaderboard");
const sourceLink=document.getElementById("source-link");
const statusButtons=Array.from(document.querySelectorAll("[data-status]"));
let statusFilter="active";
function rankText(n){return n+"位"}
function sourceFor(r){
 if(r.slug==="hakone"){
  const tn=r.year===2026?106:r.year-1921;
  return "https://www.hakone-ekiden.jp/record/record04.php?sec="+r.leg+"&tn="+tn;
 }
 if(r.slug==="izumo")return "https://www.izumo-ekiden.jp/"+(r.year-1988)+"/record/record.html";
 if(r.year===2025)return "https://www.iuau.jp/sp1/ev2025/57meki/57meki_result.pdf";
 if(r.year===2024)return "https://www.iuau.jp/ev2024/56meki/56meki_result.pdf";
 return "https://www.iuau.jp/sp1/ev2023/55meki/55meki_result.pdf";
}
function render(){
  const chosen=select.value;
  const q=query.value.trim().toLocaleLowerCase("ja");
  const found=Array.from(groups.values()).filter(function(g){
   const active=!!activeStudent(g.school,g.name);
   return (statusFilter==="active"?active:!active)&&(!chosen||g.school===chosen)&&(!q||g.name.toLocaleLowerCase("ja").includes(q));
  }).sort(function(a,b){
   const ai=schoolOrder.indexOf(a.school),bi=schoolOrder.indexOf(b.school);
   const ag=activeStudent(a.school,a.name),bg=activeStudent(b.school,b.name);
   return ai-bi||(bg?bg.grade:0)-(ag?ag.grade:0)||a.name.localeCompare(b.name,"ja");
  });
 tbody.replaceChildren();
 count.textContent=found.length+"人 / "+found.reduce(function(n,g){return n+g.records.length},0)+"件";
  if(!found.length){
   const tr=document.createElement("tr"),td=document.createElement("td");
   td.colSpan=5;td.className="empty";td.textContent="該当する出走記録がありません。";tr.appendChild(td);tbody.appendChild(tr);return;
 }
  found.forEach(function(g){
   const tr=document.createElement("tr");
   const active=activeStudent(g.school,g.name);
   const teamColor=schoolColors[g.school];
   const school=document.createElement("td");school.className="school";
   const schoolLabel=document.createElement("span");schoolLabel.className="school-label";
   if(teamColor){school.style.setProperty("--team",teamColor);schoolLabel.classList.add("team-mark")}
   const schoolText=document.createElement("span");schoolText.textContent=schoolDisplayNames[g.school]||g.school;
   schoolLabel.appendChild(schoolText);school.appendChild(schoolLabel);
   const runner=document.createElement("td");runner.className="runner"+(g.name==="吉倉 ナヤブ直希"?" long-name":"");
   const runnerName=document.createElement("span");runnerName.className="runner-name";runnerName.textContent=g.name;runner.appendChild(runnerName);
   const statusTag=document.createElement("span");statusTag.className="runner-status"+(active?" current":" alumni");statusTag.textContent=active?"（"+active.grade+"年）":"（OB）";runner.appendChild(statusTag);
   const historyCells=[];
   ["izumo","alljapan","hakone"].forEach(function(slug){
    const cell=document.createElement("td");cell.className="history-cell event-"+slug;
    const holder=document.createElement("div");holder.className="history-list";
    const entries=g.records.filter(function(record){return record.slug===slug}).sort(function(a,b){return b.year-a.year||a.leg-b.leg});
    if(!entries.length){cell.classList.add("no-record");cell.textContent="—"}
    entries.forEach(function(r){
     const b=document.createElement("button");b.type="button";b.className="record"+(r.rank<=3?" medal-"+r.rank:"");
     b.dataset.key=r.slug+"-"+r.year+"-"+r.leg;b.dataset.school=r.school;b.dataset.name=r.name;b.dataset.rank=String(r.rank);
     const year=document.createElement("span");year.className="record-year";year.textContent=r.year+"年";
     const detail=document.createElement("span");detail.className="record-detail";
     const leg=document.createElement("span");leg.textContent=r.leg+"区";
     const rank=document.createElement("span");rank.className="rank";rank.textContent=rankText(r.rank);
     detail.append(leg,rank);b.append(year,detail);holder.appendChild(b);
    });
    if(entries.length)cell.appendChild(holder);
    historyCells.push(cell);
   });
   tr.append(school,runner,...historyCells);tbody.appendChild(tr);
 });
}
function openRecord(button){
 const key=button.dataset.key,parts=key.split("-");
 const slug=parts[0],year=Number(parts[1]),leg=Number(parts[2]);
  const records=data.top10[key]||[];
 dialogTitle.textContent=year+"年 "+names[slug]+" "+leg+"区";
 dialogContext.textContent="選手："+button.dataset.name+"（"+button.dataset.school+"）／区間順位 "+rankText(Number(button.dataset.rank));
 leaderboard.replaceChildren();
  records.forEach(function(r){
   const tr=document.createElement("tr");
   tr.className=(r.rank<=3?"podium-"+r.rank+" ":"")+(r.name===button.dataset.name&&r.school===button.dataset.school?"current":"");
   const grade=gradeAt(r,slug,year);
   const values=[rankText(r.rank),r.name+"（"+grade+"）",r.school,r.time];
   values.forEach(function(value,index){
    const td=document.createElement("td");
    if(index===2){
     const teamColor=schoolColors[r.school];
     if(teamColor){td.style.setProperty("--team",teamColor);const label=document.createElement("span");label.className="school-label team-mark";label.textContent=value;td.appendChild(label)}else td.textContent=value;
    }else{td.textContent=value;}
    tr.appendChild(td);
   });
   leaderboard.appendChild(tr);
 });
 sourceLink.href=sourceFor({slug:slug,year:year,leg:leg});
 if(!records.length){
   const tr=document.createElement("tr"),td=document.createElement("td");td.colSpan=4;td.textContent="区間上位記録がありません。";tr.appendChild(td);leaderboard.appendChild(tr);
 }
 dialog.showModal();
}
tbody.addEventListener("click",function(event){const button=event.target.closest("button.record");if(button)openRecord(button)});
document.getElementById("close-dialog").addEventListener("click",function(){dialog.close()});
dialog.addEventListener("click",function(event){if(event.target===dialog)dialog.close()});
select.addEventListener("change",render);query.addEventListener("input",render);
statusButtons.forEach(function(button){button.addEventListener("click",function(){statusFilter=button.dataset.status;statusButtons.forEach(function(item){item.setAttribute("aria-pressed",String(item===button))});render()})});
render();
})();
</script>
