<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三大駅伝 出走記録</title>
<style>
:root{color-scheme:light;--ink:#243044;--muted:#67768a;--line:#e1e7ee;--paper:#fff;--bg:#f3f6f9;--accent:#245d8c;--soft:#eef4fa;--agu:#18775f;--kokugakuin:#762b37;--waseda:#a1233b;--komazawa:#624583;--chuo:#bd303b;--juntendo:#3478a8;--soka:#b32e4a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",Meiryo,sans-serif;font-size:15px;line-height:1.55}
header{background:linear-gradient(180deg,#fff,#fcfdff);border-bottom:1px solid var(--line);box-shadow:0 2px 12px rgba(28,45,67,.035)}
.wrap{max-width:1280px;margin:0 auto;padding:24px 22px}
header .wrap{padding-top:26px;padding-bottom:22px}
h1{margin:0;font-size:1.55rem;font-weight:700;letter-spacing:.005em}
.intro{margin:7px 0 0;color:var(--muted)}
main{max-width:1280px;margin:0 auto;padding:20px 22px 38px}
.filters{display:flex;align-items:end;gap:12px;flex-wrap:wrap;background:var(--paper);border:1px solid #dce5ee;border-radius:11px;padding:15px;margin-bottom:14px;box-shadow:0 3px 14px rgba(30,48,70,.045)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.82rem;font-weight:650;color:#536579}
.status-switch{display:flex;gap:3px;padding:3px;border:1px solid #d3dde7;border-radius:8px;background:#f4f7fa}
.status-switch button{min-height:32px;padding:4px 12px;border:0;border-radius:6px;background:transparent;color:#526275;font:inherit;font-size:.88rem;cursor:pointer;transition:background .15s ease,color .15s ease,box-shadow .15s ease}
.status-switch button[aria-pressed="true"]{background:#fff;color:#173f68;box-shadow:0 1px 4px rgba(23,50,78,.16);font-weight:700}
select,input{height:40px;padding:8px 10px;border:1px solid #cbd6e1;border-radius:7px;background:#fff;color:var(--ink);font:inherit;transition:border-color .15s ease,box-shadow .15s ease}
select{min-width:190px}
input{width:min(260px,75vw)}
select:focus,input:focus,button:focus-visible,a:focus-visible{outline:3px solid #a9c9e7;outline-offset:2px}
select:hover,input:hover{border-color:#9eb5c9}
select:focus,input:focus{outline:none;border-color:#6898bd;box-shadow:0 0 0 3px rgba(79,141,190,.17)}
.count{margin-left:auto;color:#536579;font-size:.9rem;font-weight:600;font-variant-numeric:tabular-nums;padding:8px 0}
.panel{background:var(--paper);border:1px solid #dce5ee;border-radius:11px;overflow:hidden;box-shadow:0 5px 24px rgba(30,48,70,.055)}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;background:#f5f8fb;color:#4d5e71;font-size:.82rem;font-weight:700;white-space:nowrap;border-bottom:1px solid #dce5ee;padding:11px 14px}
tbody td{vertical-align:top;border-bottom:1px solid var(--line);padding:9px 14px}
@media(min-width:701px){.records-table tbody td{padding-top:8px;padding-bottom:8px}.records-table tbody td.runner{padding-left:18px}}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fbfcfe}
.school{width:102px;min-width:102px;white-space:normal;font-size:.84rem}
.school,.runner{vertical-align:middle}
.school{text-align:left}
.school-label{text-align:left}
.school-label{display:inline-block;margin-left:5px;text-align:left}
.school-label.team-mark{display:inline-block;max-width:100%;margin-left:5px;padding:1px 0;border-bottom:2px solid color-mix(in srgb,var(--team) 28%,transparent);border-radius:0;background:transparent;text-align:left}
.runner{width:101px;min-width:101px;font-weight:600;white-space:nowrap}
.runner.long-name{font-size:.88rem}
.runner-name{display:inline}
.runner-status{display:inline;margin-left:3px;font-size:.8rem;font-weight:500;color:#667085;white-space:nowrap}
.runner-status.current{color:#356254}
.records-table{min-width:1080px}
.records-table th.achievements{min-width:225px;background:#f1f5f7;color:#435264}
.records-table td.achievements{min-width:225px;vertical-align:middle}
.achievement-list{display:flex;flex-direction:column;gap:4px}
.achievement-item{font-size:.76rem;line-height:1.35;text-decoration:underline;text-decoration-color:#b5c3d0;text-underline-offset:2px}
button.achievement-item{padding:0;border:0;background:transparent;color:var(--accent);font-family:inherit;text-align:left;cursor:pointer}
.achievement-item.plain{text-decoration:none;color:var(--ink)}
.achievement-item:hover{text-decoration-color:currentColor}
button.achievement-item:hover{background:transparent}
button.achievement-item:focus-visible{border-radius:2px}
.no-achievements{color:#c0c5ce;text-align:center}
.records-table th.event-izumo{background:#e8efff;color:#315c9a}
.records-table th.event-alljapan{background:#fff0dc;color:#865323}
.records-table th.event-hakone{background:#eaf3eb;color:#39704b}
.history-cell{min-width:211px;vertical-align:top}
.mobile-event-label{display:none}
.history-cell.event-izumo{background:#f5f8ff}
.history-cell.event-alljapan{background:#fff9f1}
.history-cell.event-hakone{background:#f5faf5}
.history-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.record{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;width:100%;min-width:0;border:1px solid #d5dfe9;border-radius:7px;background:#fff;color:#344054;padding:5px 7px;font:inherit;line-height:1.3;cursor:pointer;text-align:left;box-shadow:0 1px 2px rgba(27,48,73,.045);transition:border-color .16s ease,box-shadow .16s ease,background .16s ease}
.record:hover{border-color:#87a8c6;background:#fff;color:#153d66;box-shadow:0 3px 9px rgba(28,67,102,.12)}
.record-year{font-size:.7rem;font-weight:600;color:#697586;font-variant-numeric:tabular-nums;white-space:nowrap}
.record-detail{display:flex;align-items:center;gap:5px;font-size:.83rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.record .rank{padding:0;color:#344054;font-weight:700}
.record.medal-1{background:#fff6d9;border-color:#d9b64e}
.record.medal-2{background:#e8ecf0;border-color:#c2cbd4}
.record.medal-3{background:#fff0e4;border-color:#ce9468}
.record.medal-1 .rank,.leaderboard tr.podium-1 td:first-child{background:#f0d47a;color:#604907;font-weight:700}
.record.medal-2 .rank,.leaderboard tr.podium-2 td:first-child{background:#cfd7df;color:#3f4a55;font-weight:700}
.record.medal-3 .rank,.leaderboard tr.podium-3 td:first-child{background:#e8bd9d;color:#714326;font-weight:700}
.no-record{color:#c0c5ce;text-align:center}
.empty{color:var(--muted);padding:28px;text-align:center}
@media(min-width:701px){
 .records-table tbody tr:hover td.school,.records-table tbody tr:hover td.runner,.records-table tbody tr:hover td.achievements{background:#f9fbfd}
}
footer{max-width:1280px;margin:14px auto 0;padding:0 22px 28px;color:var(--muted);font-size:.83rem}
.source-links{display:flex;gap:12px;flex-wrap:wrap;margin-top:7px}
a{color:var(--accent)}
dialog{width:min(760px,calc(100vw - 28px));max-height:min(86vh,820px);padding:0;border:1px solid #d4dde7;border-radius:14px;box-shadow:0 22px 60px rgba(18,35,55,.25);color:var(--ink)}
dialog::backdrop{background:rgba(20,30,43,.45)}
.dialog-head{position:sticky;top:0;z-index:1;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:17px 19px;background:#fcfdff;border-bottom:1px solid var(--line)}
.dialog-head h2{margin:0;font-size:1.15rem;font-weight:650}
.close{border:1px solid #d6e0ea;border-radius:7px;background:#fff;padding:5px 10px;color:var(--ink);font:inherit;cursor:pointer;transition:background .15s ease,border-color .15s ease}
.close:hover{background:#f3f7fa;border-color:#b8cbdc}
.dialog-body{padding:12px 18px 17px;overflow:auto}
.context{margin:0 0 12px;color:var(--muted);font-size:.9rem}
.dialog-context-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:12px}
.dialog-context-row .context{flex:1;min-width:0;margin:0}
.leaderboard th,.leaderboard td{padding:9px 10px}
.leaderboard td:first-child,.leaderboard th:first-child{width:46px;text-align:center;font-variant-numeric:tabular-nums}
.leaderboard td.rank-ten{white-space:nowrap;font-size:.82em;letter-spacing:-.04em}
@media(min-width:701px){
 dialog{max-height:none;overflow:visible}
 .dialog-body{padding-bottom:27px;overflow:visible}
 .close{padding:4px 8px;font-size:.9rem}
 .leaderboard tr.podium-1 td,.leaderboard tr.podium-2 td,.leaderboard tr.podium-3 td{padding-top:7px;padding-bottom:7px}
 .leaderboard tr:not(.podium-1):not(.podium-2):not(.podium-3) td{padding-top:8.25px;padding-bottom:8.25px}
}
.leaderboard td:last-child,.leaderboard th:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.leaderboard .school-name-short{display:none}
.leaderboard tr.podium-1{background:#fff7df}
.leaderboard tr.podium-2{background:#f3f5f7}
.leaderboard tr.podium-3{background:#fff2e8}
.leaderboard tr.podium-1 td:first-child,.leaderboard tr.podium-2 td:first-child,.leaderboard tr.podium-3 td:first-child{border-radius:4px}
.leaderboard tr.current{background:#eef5fb;font-weight:600}
.leaderboard tr.current.podium-1{background:#fff4d9}
.legend{margin:8px 0 0;color:var(--muted);font-size:.8rem}
.dialog-source{flex:0 0 auto;margin:0;text-align:right;font-size:.82rem;white-space:nowrap}
@media(max-width:700px){
 .wrap,main{padding-left:14px;padding-right:14px}
 .filters{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;align-items:end;gap:7px;padding:12px}
 .field{min-width:0}
 .field:nth-child(1){grid-column:1}
 .field:nth-child(2){grid-column:2}
 .field:nth-child(3){grid-column:3}
 select,input{width:100%;min-width:0;min-height:40px;padding:7px 8px;font-size:.9rem}
 input[type="search"]{font-size:16px}
 .status-switch{min-height:40px;align-items:center}
 .status-switch button{min-height:32px;padding:4px 7px}
 .count{grid-column:1/-1;margin:0;width:auto;padding:0 2px 0;text-align:right;font-size:.82rem;white-space:nowrap}
 h1{font-size:1.3rem}
 .panel{border:0;background:transparent;overflow:visible;box-shadow:none}
 .table-scroll{overflow-x:hidden}
 .records-table{display:block;width:100%;min-width:0}
 .records-table thead{display:none}
 .records-table tbody{display:block;width:100%}
 .records-table tbody tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:"school runner runner" "izumo alljapan hakone" "highlights highlights highlights";margin-bottom:10px;border:1px solid #dce5ee;border-radius:12px;background:#fff;overflow:hidden;box-shadow:0 3px 12px rgba(30,48,70,.06)}
 .records-table tbody td{display:block;min-width:0;width:auto;border:0}
 .records-table tbody td.school{grid-area:school;align-self:center;padding:11px 4px 9px 11px;font-size:.75rem;font-weight:650;color:#536579;text-align:left}
 .records-table .school-label{margin-left:0}
 .records-table tbody td.runner{grid-area:runner;align-self:center;padding:11px 9px 9px 3px;white-space:normal;overflow-wrap:anywhere;font-size:.92rem;font-weight:700;line-height:1.3}
 .records-table tbody td.runner.long-name{font-size:.78rem}
 .records-table tbody td.history-cell{display:flex;flex-direction:column;min-width:0;min-height:80px;gap:5px;padding:7px 4px 9px;border-top:1px solid var(--line);background:#fff}
 .records-table tbody td.event-izumo{grid-area:izumo}
 .records-table tbody td.event-alljapan{grid-area:alljapan}
 .records-table tbody td.event-hakone{grid-area:hakone}
 .records-table tbody td.event-izumo,.records-table tbody td.event-alljapan{border-right:1px solid var(--line)}
 .mobile-event-label{display:block;flex:0 0 auto;padding:4px 2px;border-radius:6px;text-align:center;font-size:.74rem;font-weight:700;letter-spacing:.01em;line-height:1.25}
 .event-izumo .mobile-event-label{background:#e8efff;color:#315c9a}
 .event-alljapan .mobile-event-label{background:#fff0dc;color:#865323}
 .event-hakone .mobile-event-label{background:#eaf3eb;color:#39704b}
 .history-list{display:flex;flex-direction:column;gap:4px;width:100%}
 .record{min-width:0;width:100%;padding:4px 5px;gap:1px}
 .record-year{font-size:.68rem}
 .record-detail{gap:3px;font-size:.76rem}
 .records-table tbody td.achievements{grid-area:highlights;display:block;padding:8px 11px 10px;border-top:1px solid var(--line);background:#fbfcfe}
 .records-table tbody td.achievements::before{content:"主な実績";display:block;margin-bottom:4px;color:#667085;font-size:.72rem;font-weight:700}
 .achievement-list{gap:3px}
 .achievement-item{font-size:.75rem}
 .records-table tbody td.no-achievements{display:none!important}
 .records-table tbody td.empty{grid-column:1/-1;margin:0;padding:24px 12px}
 dialog{width:calc(100vw - 20px);max-height:88vh}
 .dialog-head{gap:8px;padding:12px}
 .dialog-head h2{font-size:1rem}
 .dialog-body{padding:9px 10px 14px}
 .dialog-context-row{gap:8px}
 .dialog-context-row .context{font-size:.8rem}
 .dialog-source{font-size:.78rem}
 .leaderboard{width:100%;table-layout:fixed;font-size:.78rem}
 .leaderboard th,.leaderboard td{padding:6px 3px}
 .leaderboard th:first-child,.leaderboard td:first-child{width:40px;text-align:center;font-size:.72rem}
 .leaderboard td.rank-ten{font-size:.72rem;letter-spacing:-.03em}
 .leaderboard th:nth-child(3){width:62px}
 .leaderboard th:last-child{width:68px}
 .leaderboard.achievement-mode th:nth-child(3){width:88px}
 .leaderboard.achievement-mode th:last-child{width:66px}
 .leaderboard.achievement-mode td:nth-child(3){white-space:normal;overflow-wrap:anywhere;text-align:left;font-size:.66rem}
 .leaderboard td:nth-child(2){white-space:nowrap;font-size:.75rem}
 .leaderboard td:nth-child(2).long-name{font-size:.64rem;letter-spacing:-.025em}
 .leaderboard td:nth-child(3){white-space:nowrap;text-align:left;font-size:.7rem}
 .leaderboard .school-name-full{display:none}
 .leaderboard .school-name-short{display:inline;white-space:nowrap}
 .leaderboard .school-label{margin-left:0}
 .leaderboard .school-label.team-mark{padding:1px 0;border-radius:0;background:transparent}
}
@media(max-width:360px){
 .records-table tbody tr{grid-template-areas:"school school school" "runner runner runner" "izumo alljapan hakone" "highlights highlights highlights"}
 .records-table tbody td.school{padding:9px 9px 0;font-size:.73rem}
 .records-table tbody td.runner{padding:1px 9px 9px;font-size:.9rem}
 .records-table tbody td.runner.long-name{font-size:.82rem}
 .records-table tbody td.history-cell{padding-left:3px;padding-right:3px}
 .record{padding-left:4px;padding-right:4px}
 .record-detail{gap:2px;font-size:.72rem}
 .leaderboard th:nth-child(3){width:58px}
 .leaderboard th:last-child{width:66px}
 .leaderboard.achievement-mode th:nth-child(3){width:82px}
 .leaderboard.achievement-mode th:last-child{width:64px}
 .leaderboard td:nth-child(2).long-name{font-size:.58rem}
}
@media(prefers-reduced-motion:reduce){
 select,input,.status-switch button,.record,.close{transition:none}
}
</style>
</head>
<body>
<header><div class="wrap">
<h1>三大駅伝 出走記録</h1>
</div></header>
<main>
<section class="filters" aria-label="選手を絞り込む">
<div class="field"><label for="school-filter">大学</label><select id="school-filter"><option value="">すべて</option></select></div>
<div class="field"><label for="name-filter">選手名</label><input id="name-filter" type="search" placeholder="選手名で検索"></div>
<div class="field"><label>在籍状況</label><div class="status-switch" role="group" aria-label="現役・OBの切り替え"><button type="button" data-status="active" aria-pressed="true">現役</button><button type="button" data-status="alumni" aria-pressed="false">OB</button></div></div>
<div class="count" id="count" aria-live="polite"></div>
</section>
<section class="panel" aria-label="出走履歴">
<div class="table-scroll">
<table class="records-table">
<thead><tr><th scope="col">大学</th><th scope="col">選手</th><th scope="col" class="achievements">主な実績</th><th scope="col" class="event-izumo">出雲</th><th scope="col" class="event-alljapan">全日本</th><th scope="col" class="event-hakone">箱根</th></tr></thead>
<tbody id="records"></tbody>
</table>
</div>
</section>
</main>
<footer>
<div>記録対象：箱根 2022〜2026年、出雲・全日本 2023〜2025年。区間1〜3位は淡い金・銀・銅色で表示します。</div>
<div>現役は2026年度の各大学部員名簿を基準に表示しています。上位記録の「—」は学年未確認です。</div>
<div class="source-links">記録元：
<a href="https://www.hakone-ekiden.jp/record/" target="_blank" rel="noopener">箱根駅伝公式記録</a>
<a href="https://www.izumo-ekiden.jp/" target="_blank" rel="noopener">出雲駅伝公式記録</a>
<a href="https://www.iuau.jp/" target="_blank" rel="noopener">日本学生陸上競技連合</a>
</div>
<div class="source-links">現役名簿：
<a href="https://aogaku-tf.com/member/member.php" target="_blank" rel="noopener">青学</a>
<a href="https://www.kokugakuin.com/member/" target="_blank" rel="noopener">國學院</a>
<a href="https://waseda-ac.jp/team/member/block/3" target="_blank" rel="noopener">早稲田</a>
<a href="https://komazawa-ekiden.com/team/team-1th" target="_blank" rel="noopener">駒澤</a>
<a href="https://chuo-tf.com/member-long/1st-grade/" target="_blank" rel="noopener">中央</a>
<a href="https://iiwanet.jp/j_trackfield/athletes" target="_blank" rel="noopener">順天堂</a>
<a href="https://www.soka-ekiden.com/memt.html" target="_blank" rel="noopener">創価</a>
</div>
</footer>
<dialog id="detail-dialog" aria-labelledby="dialog-title">
<div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" class="close" id="close-dialog">閉じる</button></div>
<div class="dialog-body">
<div class="dialog-context-row"><p class="context" id="dialog-context"></p><p class="dialog-source"><a id="source-link" href="#" target="_blank" rel="noopener">公式結果</a></p></div>
<div class="table-scroll">
<table class="leaderboard"><thead><tr><th scope="col">順位</th><th scope="col">選手</th><th scope="col">所属</th><th scope="col">タイム</th></tr></thead><tbody id="leaderboard"></tbody></table>
</div>
<p class="legend" id="dialog-legend">学年は出場時点。</p>

   }else{achievementCell.classList.add("no-achievements");achievementCell.textContent="—"}
   const historyCells=[];
   ["izumo","alljapan","hakone"].forEach(function(slug){
    const cell=document.createElement("td");cell.className="history-cell event-"+slug;
    const holder=document.createElement("div");holder.className="history-list";
    const entries=g.records.filter(function(record){return record.slug===slug}).sort(function(a,b){return b.year-a.year||a.leg-b.leg});
    if(!entries.length){cell.classList.add("no-record");cell.textContent="—"}
    entries.forEach(function(r){
     const b=document.createElement("button");b.type="button";b.className="record"+(r.rank<=3?" medal-"+r.rank:"");
     b.dataset.key=r.slug+"-"+r.year+"-"+r.leg;b.dataset.school=r.school;b.dataset.name=r.name;b.dataset.rank=String(r.rank);
     const year=document.createElement("span");year.className="record-year";year.textContent=r.year+"年";
     const detail=document.createElement("span");detail.className="record-detail";
     const leg=document.createElement("span");leg.textContent=r.leg+"区";
     const rank=document.createElement("span");rank.className="rank";rank.textContent=rankText(r.rank);
     detail.append(leg,rank);b.append(year,detail);holder.appendChild(b);
    });
    if(entries.length)cell.appendChild(holder);
    const eventLabel=document.createElement("span");eventLabel.className="mobile-event-label";eventLabel.textContent=names[slug];cell.prepend(eventLabel);
    historyCells.push(cell);
   });
   tr.append(school,runner,achievementCell,...historyCells);tbody.appendChild(tr);
 });
}
function openRecord(button){
 const key=button.dataset.key,parts=key.split("-");
 const slug=parts[0],year=Number(parts[1]),leg=Number(parts[2]);
  const records=data.top10[key]||[];
 dialogTitle.textContent=year+"年 "+names[slug]+" "+leg+"区";
 dialogLegend.textContent="学年は出場時点。";
 leaderboard.classList.remove("achievement-mode");
 dialogContext.textContent="選手："+button.dataset.name+"（"+button.dataset.school+"）／区間順位 "+rankText(Number(button.dataset.rank));
 leaderboard.replaceChildren();
  records.forEach(function(r){
   const tr=document.createElement("tr");
   tr.className=(r.rank<=3?"podium-"+r.rank+" ":"")+(r.name===button.dataset.name&&r.school===button.dataset.school?"current":"");
   const grade=gradeAt(r,slug,year);
   const values=[rankText(r.rank),r.name+"（"+grade+"）",r.school,r.time];
   values.forEach(function(value,index){
    const td=document.createElement("td");
    if(index===0&&r.rank===10)td.classList.add("rank-ten");
    if(index===1&&Array.from(r.name).length>=8)td.classList.add("long-name");
    if(index===2){
     const teamColor=schoolColors[r.school];
     const label=document.createElement("span");label.className="school-label"+(teamColor?" team-mark":"");
     if(teamColor)label.style.setProperty("--team",teamColor);
     label.setAttribute("aria-label",value);
     const full=document.createElement("span");full.className="school-name-full";full.textContent=value;
     const short=document.createElement("span");short.className="school-name-short";short.textContent=top10SchoolNames[value]||value.replace(/大学$|大學$/g,"");
     label.append(full,short);td.appendChild(label);
    }else{td.textContent=value;}
    tr.appendChild(td);
   });
   leaderboard.appendChild(tr);
 });
 sourceLink.href=sourceFor({slug:slug,year:year,leg:leg});
 if(!records.length){
   const tr=document.createElement("tr"),td=document.createElement("td");td.colSpan=4;td.textContent="区間上位記録がありません。";tr.appendChild(td);leaderboard.appendChild(tr);
 }
 dialog.showModal();
}
function openAchievement(button){
 const item=data.achievementTop10[button.dataset.achievementKey];if(!item)return;
 dialogTitle.textContent=item.title;
 dialogContext.textContent="選手："+button.dataset.name+"（"+button.dataset.school+"）／"+button.dataset.text;
 dialogLegend.textContent="所属は大会結果に記載された表記です。";
 leaderboard.classList.add("achievement-mode");leaderboard.replaceChildren();
 item.records.forEach(function(r){
  const tr=document.createElement("tr");
  tr.className=(r.rank<=3?"podium-"+r.rank+" ":"")+(normalizeName(r.name)===normalizeName(button.dataset.name)&&r.school===button.dataset.school?"current":"");
  const values=[rankText(r.rank),r.name,r.school,r.time];
  values.forEach(function(value,index){
   const td=document.createElement("td");
   if(index===0&&r.rank===10)td.classList.add("rank-ten");
   if(index===1&&Array.from(r.name).length>=8)td.classList.add("long-name");
   if(index===2){
    const teamColor=schoolColors[value];
    const label=document.createElement("span");label.className="school-label"+(teamColor?" team-mark":"");
    if(teamColor)label.style.setProperty("--team",teamColor);
    label.setAttribute("aria-label",value);
    const full=document.createElement("span");full.className="school-name-full";full.textContent=value;
    const short=document.createElement("span");short.className="school-name-short";short.textContent=top10SchoolNames[value]||value.replace(/大学$|大學$|学院大学$/g,"");
    label.append(full,short);td.appendChild(label);
   }else{td.textContent=value;}
   tr.appendChild(td);
  });
  leaderboard.appendChild(tr);
 });
 sourceLink.href=item.source;dialog.showModal();
}
tbody.addEventListener("click",function(event){const achievement=event.target.closest("button.achievement-result");if(achievement){openAchievement(achievement);return}const button=event.target.closest("button.record");if(button)openRecord(button)});
document.getElementById("close-dialog").addEventListener("click",function(){dialog.close()});
dialog.addEventListener("click",function(event){if(event.target===dialog)dialog.close()});
select.addEventListener("change",render);query.addEventListener("input",render);
statusButtons.forEach(function(button){button.addEventListener("click",function(){statusFilter=button.dataset.status;statusButtons.forEach(function(item){item.setAttribute("aria-pressed",String(item===button))});render()})});
render();
})();
</script>
